<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Pemuda Cerdas</title>
<!-- Tambahkan library SheetJS untuk kemampuan membaca Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Tambahkan html2canvas untuk fitur download sertifikat -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#F3F6FB;--card:#FFFFFF;--ink:#14213D;--mut:#55627F;--blue:#1F5FB8;--btn:#1F4E9C;--acc:#F2B705;--ok:#1B7F52;--okb:#E3F5EC;--bad:#B3321F;--badb:#FBE9E6;--line:#D9E1F0;--soft:#E7EFFC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1530;--card:#14213F;--ink:#EAF0FF;--mut:#A9B6D6;--blue:#7FB0FF;--ok:#58D39B;--okb:#12362B;--bad:#FF8E7C;--badb:#3B1B1B;--line:#2A3A60;--soft:#1B2C52}}
:root[data-theme="dark"]{--bg:#0B1530;--card:#14213F;--ink:#EAF0FF;--mut:#A9B6D6;--blue:#7FB0FF;--ok:#58D39B;--okb:#12362B;--bad:#FF8E7C;--badb:#3B1B1B;--line:#2A3A60;--soft:#1B2C52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:16px}.w.d{max-width:1000px}
.hero{background:#13294B;color:#fff;border-radius:22px;padding:28px 22px;text-align:center}
.hero h1{margin:6px 0;font-size:32px;line-height:1.2;letter-spacing:-.01em}.hero p{margin:6px 0;color:#DCE6F7;font-size:15px;}
.flag{height:8px;border-radius:4px;background:linear-gradient(#C00000 50%,#fff 50%);margin:14px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.b{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--btn);color:#fff;font:700 17px inherit;font-family:inherit;padding:14px;cursor:pointer;margin:10px 0}
.b.s{background:var(--soft);color:var(--ink)}.b.y{background:var(--acc);color:#14213D}
.b:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{background:rgba(255,255,255,.14);border-radius:30px;padding:6px 12px;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:16px inherit;font-family:inherit;background:var(--card);color:var(--ink)}
.err{color:var(--bad);font-weight:600;min-height:20px}
.bar{height:10px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.tag{display:inline-block;background:var(--soft);border-radius:30px;padding:4px 12px;font-weight:700;font-size:14px;color:var(--ink)}
.q{font-size:19px;font-weight:600;margin:12px 0;white-space:pre-wrap;}
.o{display:block;width:100%;text-align:left;min-height:54px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:16px inherit;font-family:inherit;padding:12px 14px;margin:8px 0;cursor:pointer;white-space:pre-wrap;}
.o.ok{border-color:var(--ok);background:var(--okb);animation:pop .35s}.o.no{border-color:var(--bad);background:var(--badb)}
.o:hover{border-color:var(--blue)}
.o.selected{border-color:var(--blue);background:var(--soft);font-weight:600;}
.fb{border-radius:14px;padding:14px;margin:12px 0}.fb.ok{background:var(--okb)}.fb.no{background:var(--badb)}
@keyframes pop{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
table.t{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}table.t th,table.t td{border:1px solid var(--line);padding:8px;text-align:left}table.t th{background:var(--soft)}
.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sc div{background:var(--soft);border-radius:14px;padding:12px 4px}.sc b{display:block;font-size:26px}
.sw{overflow-x:auto}.sw table{min-width:100%}
.ov{position:fixed;inset:0;background:rgba(10,20,45,.93);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
.q-card{border: 2px solid var(--line); border-radius: 12px; padding:12px; margin-bottom: 12px; background:var(--bg);}
.q-card h4{margin: 0 0 10px 0;}

/* Gaya Desain Mewah Hasil & Sertifikat */
.lux-card { background: linear-gradient(135deg, var(--card), var(--soft)); border: 1px solid var(--line); border-radius: 20px; padding: 40px 20px; box-shadow: 0 10px 30px rgba(31, 78, 156, 0.08); text-align: center; margin-bottom: 20px; }
.score-circle { width: 140px; height: 140px; background: linear-gradient(135deg, var(--btn), var(--blue)); border-radius: 50%; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 25px auto; box-shadow: 0 10px 25px rgba(31, 95, 184, 0.4); border: 6px solid var(--card); }
.score-circle b { font-size: 52px; line-height: 1.1; }
.cert-wrapper { overflow-x: auto; padding: 20px 0; background: #e9eff5; border-radius: 14px; margin-top: 10px; display: flex; justify-content: center; box-shadow: inset 0 4px 10px rgba(0,0,0,0.05); }

/* Pengaturan Presisi A4 Landscape = 1123px x 794px, Margin 1 inch = 96px padding */
.cert { width: 1123px; min-width: 1123px; height: 794px; background: #fff; position: relative; padding: 96px; box-sizing: border-box; color: #14213D; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
/* Ornamen Sudut Mewah */
.cert::before { content: ""; position: absolute; top: 0; left: 0; border-top: 120px solid #C00000; border-right: 120px solid transparent; }
.cert::after { content: ""; position: absolute; bottom: 0; right: 0; border-bottom: 120px solid #C00000; border-left: 120px solid transparent; }
.cert-decor-1 { position: absolute; top: 0; left: 0; border-top: 60px solid #F2B705; border-right: 60px solid transparent; z-index: 2; }
.cert-decor-2 { position: absolute; bottom: 0; right: 0; border-bottom: 60px solid #F2B705; border-left: 60px solid transparent; z-index: 2; }

.cert-inner { height: 100%; position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
.cert-header { display: flex; align-items: center; justify-content: center; gap: 30px; width: 100%; margin-bottom: 10px; }
.cert-header img { height: 85px; object-fit: contain; }
.cert-header-text { text-align: center; }
.cert-header-text h3 { margin: 0; font-size: 22px; color: #14213D; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
.cert-header-text p { margin: 4px 0 0 0; font-size: 15px; color: #55627F; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

.cert-title-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 15px 0; }
.cert-title-left { color: #F2B705; text-align: right; text-transform: uppercase; font-weight: 900; font-size: 26px; line-height: 1.1; border-right: 3px solid #C00000; padding-right: 20px; }
.cert-title-right { font-size: 95px; font-family: 'Brush Script MT', 'Great Vibes', 'Dancing Script', cursive; color: #C00000; line-height: 0.8; margin: 0; padding-left: 10px; font-weight: normal; }

.cert-subtitle { font-size: 18px; color: #333; margin: 20px 0; font-weight: 600; letter-spacing: 1px; }
.cert-name { font-size: 48px; font-weight: bold; color: #14213D; border-bottom: 2px solid #333; display: inline-block; min-width: 650px; padding: 0 40px 10px; text-align: center; margin-bottom: 25px; font-family: 'Times New Roman', serif; text-transform: uppercase; }
.cert-desc { font-size: 20px; line-height: 1.6; max-width: 850px; text-align: center; color: #333; font-weight: 500; }
.cert-score { font-size: 28px; font-weight: 900; color: #C00000; margin-top: 15px; letter-spacing: 2px; }

.cert-footer { display: flex; justify-content: space-between; width: 85%; margin-top: auto; }
.cert-sign { text-align: center; width: 300px; }
.cert-sign .line { width: 100%; border-bottom: 1px solid #14213D; margin: 0 auto 8px; }
.cert-sign p { margin: 0; font-size: 19px; color: #14213D; font-weight: bold; }
.cert-sign span { font-size: 16px; color: #55627F; font-weight: 600; }

@media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .c { border: none; padding: 0; margin: 0; box-shadow: none; }
    table.t th { background: #f0f0f0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===== KONFIGURASI ===== */
// URL Web App Google Apps Script Anda (WAJIB DIPASTIKAN BENAR)
var SHEET_URL = 'https://script.google.com/macros/s/AKfycbzPuXCLgDflKpk4SAWmyzIZIRQUVm08MTnIWpxScXJijKuvSb5AyW_7GR0-BDFGemfapA/exec';

/* ===== DATA SOAL DEFAULT ===== */
const defaultQuestions = [
    { q: "Siapakah proklamator kemerdekaan Republik Indonesia?", options: ["Ir. Soekarno & Drs. Moh. Hatta", "Soeharto & B.J. Habibie", "Jenderal Sudirman & Bung Tomo", "Sutan Sjahrir & Tan Malaka"], ans: 0 },
    { q: "Apa nama ibukota negara Indonesia saat ini?", options: ["Surabaya", "Bandung", "Jakarta", "Yogyakarta"], ans: 2 },
    { q: "Kapan Hari Sumpah Pemuda diperingati?", options: ["17 Agustus", "28 Oktober", "10 November", "1 Juni"], ans: 1 },
    { q: "Lagu kebangsaan Indonesia Raya diciptakan oleh?", options: ["Ibu Sud", "W.R. Supratman", "Ismail Marzuki", "C. Simanjuntak"], ans: 1 }
];

/* ===== STATE APLIKASI ===== */
let state = {
    view: 'home', 
    user: null,
    currentQuestion: 0,
    score: 0,
    answers: [],
    adminData: [],
    questions: [],
    adminTab: 'hasil', // 'hasil' atau 'soal'
    selectedOption: null // Tambahan untuk melacak opsi yang sedang dipilih
};

// --- FUNGSI RENDER UTAMA ---
function render() {
    const app = document.getElementById('app');
    if (state.view === 'home') app.innerHTML = viewHome();
    else if (state.view === 'peserta_login') app.innerHTML = viewPesertaLogin();
    else if (state.view === 'panitia_login') app.innerHTML = viewPanitiaLogin();
    else if (state.view === 'quiz') app.innerHTML = viewQuiz();
    else if (state.view === 'result') app.innerHTML = viewResult();
    else if (state.view === 'panitia_dash') app.innerHTML = viewPanitiaDash();
}

function viewHome() {
    return `
        <div class="w">
            <div class="hero">
                <h1>MISI PEMUDA CERDAS</h1>
                <p>Lomba Literasi dan Numerasi (LITNUM) dalam rangka Hari Sumpah Pemuda</p>
                <div class="flag"></div>
            </div>
            <div class="c" style="text-align:center;">
                <h3 style="margin-top:0">Pilih Akses Masuk</h3>
                <button class="b y" onclick="navigate('peserta_login')">Masuk Sebagai Peserta</button>
                <button class="b s" onclick="navigate('panitia_login')">Masuk Sebagai Panitia</button>
            </div>
        </div>
    `;
}

function viewPesertaLogin() {
    return `
        <div class="w">
            <div class="c">
                <h2 style="margin-top:0">Login Peserta</h2>
                <label>Nama Lengkap</label>
                <input type="text" id="p_nama" placeholder="Masukkan nama Anda">
                <label>Kelas</label>
                <input type="text" id="p_kelas" placeholder="Masukkan kelas Anda">
                <button class="b" style="margin-top:20px" onclick="startQuiz()">Mulai Mengerjakan</button>
                <button class="b s" onclick="navigate('home')">Kembali</button>
            </div>
        </div>
    `;
}

function viewPanitiaLogin() {
    return `
        <div class="w">
            <div class="c">
                <h2 style="margin-top:0">Login Panitia</h2>
                <label>Password Panitia</label>
                <input type="password" id="a_pass" placeholder="Masukkan password">
                <button class="b" style="margin-top:20px" onclick="loginAdmin()">Masuk Dashboard</button>
                <button class="b s" onclick="navigate('home')">Kembali</button>
            </div>
        </div>
    `;
}

function viewQuiz() {
    if(state.questions.length === 0) return `<div class="w"><div class="c">Memuat soal...</div></div>`;
    const q = state.questions[state.currentQuestion];
    let optionsHtml = '';
    q.options.forEach((opt, idx) => {
        const isSelected = (state.selectedOption === idx) ? 'selected' : '';
        optionsHtml += `<button class="o ${isSelected}" onclick="selectOption(${idx})">${opt}</button>`;
    });

    return `
        <div class="w">
            <div class="c">
                <div class="top">
                    <span>Soal ${state.currentQuestion + 1} / ${state.questions.length}</span>
                    <span class="tag">${state.user.nama}</span>
                </div>
                <div class="bar" style="margin: 10px 0;"><i style="width: ${((state.currentQuestion) / state.questions.length) * 100}%"></i></div>
                <div class="q">${q.q}</div>
                ${optionsHtml}
                <button class="b" style="margin-top:20px" onclick="submitAnswer()" ${state.selectedOption === null ? 'disabled' : ''}>Jawab</button>
            </div>
        </div>
    `;
}

function viewResult() {
    return `
        <div class="w d">
            <div class="lux-card">
                <h2 style="color:var(--btn); margin-top:0; font-size:32px; font-weight:800;">Ujian Selesai!</h2>
                <p style="font-size:17px;">Terima kasih, <b>${state.user.nama}</b> telah menyelesaikan ujian dengan baik.</p>
                <div class="score-circle">
                    <b>${Math.round(state.score)}</b>
                    <span style="font-size:15px; opacity:0.9; margin-top:4px;">Skor Akhir</span>
                </div>
                <p style="color:var(--mut); font-size:15px; margin-bottom:28px;">Hasil Anda telah dikirim dan direkam secara otomatis oleh sistem Panitia.</p>
                
                <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
                    <button class="b y" style="max-width:250px; margin:0; display:flex; align-items:center; justify-content:center; gap:8px; font-size:16px;" onclick="downloadCertificate()">
                        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        Unduh Sertifikat
                    </button>
                    <button class="b s" style="max-width:250px; margin:0; font-size:16px;" onclick="navigate('home')">Kembali ke Beranda</button>
                </div>
            </div>

            <div class="c" style="overflow:hidden; text-align:center;">
                <h3 style="margin-top:0; color:var(--ink);">Preview Sertifikat</h3>
                <div class="cert-wrapper">
                    <div class="cert" id="certificateNode">
                        <div class="cert-decor-1"></div><div class="cert-decor-2"></div>
                        <div class="cert-inner">
                            <div class="cert-header">
                                <!-- Format gambar diubah ke .png sesuai dengan yang ada di repo GitHub Anda -->
                                <img src="LOGO SMK 45.png" alt="Logo SMK">
                                <div class="cert-header-text">
                                    <h3>Festival Literasi dan Numerasi</h3>
                                    <p>Misi Pemuda Cerdas - Hari Sumpah Pemuda</p>
                                </div>
                                <img src="Logo Festival Literasi LITNUM FEST.png" alt="Logo Litnum">
                            </div>
                            
                            <div class="cert-title-container">
                                <div class="cert-title-left">LITNUM<br>FEST<br><span style="color:#C00000; font-size:18px;">2026</span></div>
                                <div class="cert-title-right">Certificate</div>
                            </div>
                            <div style="font-size:24px; letter-spacing: 12px; margin-top:-15px; margin-bottom: 15px; font-weight:900; color:#14213D;">O F &nbsp; H O N O U R</div>
                            
                            <div class="cert-subtitle">Sertifikat ini diberikan dengan bangga sebagai bentuk penghargaan kepada:</div>
                            
                            <div class="cert-name">${state.user.nama}</div>
                            
                            <div class="cert-desc">
                                Atas partisipasi aktif dan pencapaiannya yang luar biasa dalam kompetisi ini.<br>
                                Telah diselesaikan dengan predikat sangat baik dan memperoleh nilai akhir:
                                <div class="cert-score">SKOR: ${Math.round(state.score)}</div>
                            </div>
                            
                            <div class="cert-footer">
                                <div class="cert-sign">
                                    <div style="height: 70px;"></div>
                                    <div class="line"></div>
                                    <p>Drs. Basuni Abubakar, M.Pd.I</p>
                                    <span>Kepala Sekolah</span>
                                </div>
                                <div class="cert-sign">
                                    <div style="height: 70px;"></div>
                                    <div class="line"></div>
                                    <p>Rizki Aprilia S.A.B</p>
                                    <span>Ketua Panitia</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function downloadCertificate() {
    const cert = document.getElementById('certificateNode');
    if(!cert) return;
    showModal('Sedang menyiapkan sertifikat, mohon tunggu sebentar...');
    
    html2canvas(cert, { 
        scale: 2, // Kualitas tinggi
        useCORS: true, 
        backgroundColor: "#ffffff"
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Sertifikat_LITNUM_${state.user.nama}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        document.body.removeChild(document.body.lastChild); // tutup pop-up modal
    }).catch(err => {
        console.error(err);
        document.body.removeChild(document.body.lastChild);
        showModal('Gagal mengunduh sertifikat. Pastikan browser Anda mendukung fitur ini.');
    });
}

function viewPanitiaDash() {
    let content = '';
    if(state.adminTab === 'hasil') {
        content = renderAdminHasil();
    } else {
        content = renderAdminSoal();
    }

    return `
        <div class="w d">
            <div class="c">
                <div class="top no-print">
                    <h2>Dashboard Panitia</h2>
                    <div>
                        <button class="b s" style="display:inline-block; width:auto; min-height:auto; padding:8px 16px; margin:0; ${state.adminTab==='hasil'?'background:var(--blue);color:#fff;':''}" onclick="state.adminTab='hasil'; render()">Hasil Ujian</button>
                        <button class="b s" style="display:inline-block; width:auto; min-height:auto; padding:8px 16px; margin:0; ${state.adminTab==='soal'?'background:var(--blue);color:#fff;':''}" onclick="state.adminTab='soal'; render()">Kelola Soal</button>
                        <button class="b" style="display:inline-block; width:auto; min-height:auto; padding:8px 16px; margin:0; background:var(--bad);" onclick="navigate('home')">Keluar</button>
                    </div>
                </div>
                <div style="margin-top:20px;">
                    ${content}
                </div>
            </div>
        </div>
    `;
}

function renderAdminHasil() {
    let rows = '';
    if(state.adminData.length === 0) {
        rows = `<tr><td colspan="4" style="text-align:center">Belum ada data atau sedang memuat...</td></tr>`;
    } else {
        state.adminData.forEach((d, i) => {
            rows += `<tr>
                <td>${i+1}</td>
                <td>${d.nama}</td>
                <td>${d.instansi}</td>
                <td><b>${d.skor}</b></td>
            </tr>`;
        });
    }
    return `
        <div class="no-print" style="margin-bottom:12px;">
            <button class="b s" style="display:inline-block; width:auto; padding:8px 16px; margin:0" onclick="fetchDataAdmin()">Refresh Data</button>
            <button class="b y" style="display:inline-block; width:auto; padding:8px 16px; margin:0" onclick="window.print()">Cetak (Print)</button>
        </div>
        <div class="sw">
            <table class="t">
                <thead><tr><th width="50">No</th><th>Nama Peserta</th><th>Kelas</th><th width="100">Skor</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    `;
}

function renderAdminSoal() {
    let list = '';
    state.questions.forEach((q, i) => {
        list += `
        <div class="q-card" style="font-size:14px;">
            <b>${i+1}. ${q.q}</b><br>
            <span style="color:${q.ans===0?'var(--ok)':'inherit'}">A. ${q.options[0]}</span> | 
            <span style="color:${q.ans===1?'var(--ok)':'inherit'}">B. ${q.options[1]}</span> | 
            <span style="color:${q.ans===2?'var(--ok)':'inherit'}">C. ${q.options[2]}</span> | 
            <span style="color:${q.ans===3?'var(--ok)':'inherit'}">D. ${q.options[3]}</span>
        </div>`;
    });

    return `
        <div class="no-print">
            <div style="background:var(--soft); padding:16px; border-radius:12px; margin-bottom:16px;">
                <h3 style="margin-top:0; margin-bottom:8px;">Upload Soal via Excel</h3>
                <p style="font-size:14px; margin-top:0;">Buat file Excel dengan 6 kolom berurutan:<br>
                <b>Pertanyaan | Opsi A | Opsi B | Opsi C | Opsi D | Jawaban</b><br>
                <i>(Pada kolom Jawaban, cukup ketik huruf: A, B, C, atau D)</i></p>
                
                <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv" style="margin-top:8px; padding:10px; background:#fff; width:100%; border-radius:8px;" onchange="handleFileUpload(event)">
            </div>
            
            <h3 style="margin-top:0">Preview Soal (${state.questions.length})</h3>
            ${list}
            <button class="b y" style="margin-top:16px;" onclick="saveQuestionsToSheet()">Simpan Soal ke Server</button>
        </div>
    `;
}

// --- LOGIKA APLIKASI ---

function navigate(viewName) {
    state.view = viewName;
    render();
}

function showModal(msg) {
    const m = document.createElement('div');
    m.className = 'ov';
    m.innerHTML = `<div class="c" style="width:100%; max-width:320px; text-align:center; animation:pop 0.3s">
        <h3 style="margin-top:0">Info</h3>
        <p>${msg}</p>
        <button class="b" onclick="this.parentElement.parentElement.remove()">Tutup</button>
    </div>`;
    document.body.appendChild(m);
}

// Peserta
function startQuiz() {
    const nama = document.getElementById('p_nama').value.trim();
    const kelas = document.getElementById('p_kelas').value.trim();
    
    if(!nama || !kelas) { showModal('Nama dan Kelas wajib diisi!'); return; }
    
    state.user = { nama, instansi: kelas }; 
    state.currentQuestion = 0;
    state.score = 0;
    state.answers = [];
    state.selectedOption = null;
    
    // Pastikan soal sudah diload
    if(state.questions.length === 0) loadQuestions(true);
    else navigate('quiz');
}

function selectOption(idx) {
    state.selectedOption = idx;
    render();
}

function submitAnswer() {
    if(state.selectedOption === null) return; // Mencegah submit jika belum memilih
    
    const isCorrect = (state.selectedOption === state.questions[state.currentQuestion].ans);
    if(isCorrect) state.score += (100 / state.questions.length);
    
    state.answers.push(state.selectedOption);
    state.selectedOption = null; // Reset pilihan untuk soal berikutnya
    state.currentQuestion++;
    
    if(state.currentQuestion >= state.questions.length) {
        finishQuiz();
    } else {
        render();
    }
}

function finishQuiz() {
    saveDataToSheet(state.user.nama, state.user.instansi, Math.round(state.score));
    navigate('result');
}

// Panitia
function loginAdmin() {
    const pass = document.getElementById('a_pass').value;
    if(pass === 'panitia123') { // Ganti password jika diperlukan
        state.adminTab = 'hasil';
        navigate('panitia_dash');

    }
}

// Kelola Soal (Admin) - Fungsi Baca Excel
function handleFileUpload(event) {
    const file = event.target.files[0];
    if(!file) return;

    showModal('Sedang memproses file Excel...');

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(firstSheet, {defval: ""});

            let newQuestions = [];
            json.forEach(row => {
                // Menggunakan index kolom agar penamaan header di baris 1 bebas
                const keys = Object.keys(row);
                if(keys.length >= 6) {
                    const q = row[keys[0]];
                    const a = row[keys[1]];
                    const b = row[keys[2]];
                    const c = row[keys[3]];
                    const d = row[keys[4]];
                    const ansStr = String(row[keys[5]]).toUpperCase().trim();

                    let ansIdx = 0; // Default A
                    if(ansStr === 'B') ansIdx = 1;
                    else if(ansStr === 'C') ansIdx = 2;
                    else if(ansStr === 'D') ansIdx = 3;

                    // Pastikan baris memiliki isi pertanyaan dan opsi A
                    if(q && a) { 
                        newQuestions.push({
                            q: String(q),
                            options: [String(a), String(b), String(c), String(d)],
                            ans: ansIdx
                        });
                    }
                }
            });

            // Tutup pop-up processing
            document.body.removeChild(document.body.lastChild);

            if(newQuestions.length > 0) {
                state.questions = newQuestions;
                render();
                showModal('Berhasil memuat ' + newQuestions.length + ' soal. Cek preview di bawah, lalu klik "Simpan Soal ke Server"!');
            } else {
                showModal('Gagal membaca data. Pastikan ada 6 kolom yang terisi sesuai format.');
            }
        } catch (err) {
            console.error(err);
            document.body.removeChild(document.body.lastChild);
            showModal('Terjadi kesalahan. Pastikan file berupa format Excel yang valid (.xlsx / .csv).');
        }
    };
    reader.readAsArrayBuffer(file);
}

/* ===== KOMUNIKASI DENGAN GOOGLE SHEET (FETCH) ===== */

// 1. Memuat Soal Saat Aplikasi Terbuka
function loadQuestions(autoStartQuiz = false) {
    if(!SHEET_URL) {
        state.questions = JSON.parse(JSON.stringify(defaultQuestions));
        if(autoStartQuiz) navigate('quiz');
        return;
    }
    fetch(SHEET_URL + "?action=getQuestions")
        .then(res => res.json())
        .then(data => {
            if(data && Array.isArray(data) && data.length > 0) state.questions = data;
            else state.questions = JSON.parse(JSON.stringify(defaultQuestions));
            if(autoStartQuiz) navigate('quiz');
        })
        .catch(e => {
            console.log('Gagal ambil soal online, pakai default.', e);
            state.questions = JSON.parse(JSON.stringify(defaultQuestions));
            if(autoStartQuiz) navigate('quiz');
        });
}

// 2. Menyimpan Perubahan Soal ke Server
function saveQuestionsToSheet() {
    showModal('Sedang menyimpan soal...');
    fetch(SHEET_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `action=saveQuestions&questions=${encodeURIComponent(JSON.stringify(state.questions))}`
    })
    .then(() => {
        showModal('Berhasil menyimpan daftar soal! Peserta berikutnya akan melihat soal terbaru.');
    })
    .catch(e => showModal('Gagal menyimpan. Pastikan URL Script benar.'));
}

// 3. Menyimpan Nilai Peserta Selesai
function saveDataToSheet(nama, instansi, skor) {
    if(!SHEET_URL) return;
    fetch(SHEET_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `action=save&nama=${encodeURIComponent(nama)}&instansi=${encodeURIComponent(instansi)}&skor=${skor}`
    }).catch(e => console.log('Gagal menyimpan hasil', e));
}

// 4. Mengambil Nilai untuk Dashboard Panitia
function fetchDataAdmin() {
    if(!SHEET_URL) return;
    fetch(SHEET_URL + "?action=get")
        .then(res => res.json())
        .then(data => {
            state.adminData = (data && Array.isArray(data)) ? data : [];
            render();
        })
        .catch(e => {
            console.log('Gagal mengambil data peserta', e);
        });
}

// Jalankan saat pertama kali dibuka
loadQuestions();
render();
