<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misi Pemuda Cerdas</title>
<!-- Tambahkan library SheetJS untuk kemampuan membaca Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Tambahkan html2canvas untuk fitur download sertifikat -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#F3F6FB;--card:#FFFFFF;--ink:#14213D;--mut:#55627F;--blue:#1F5FB8;--btn:#1F4E9C;--acc:#F2B705;--ok:#1B7F52;--okb:#E3F5EC;--bad:#B3321F;--badb:#FBE9E6;--line:#D9E1F0;--soft:#E7EFFC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1530;--card:#14213F;--ink:#EAF0FF;--mut:#A9B6D6;--blue:#7FB0FF;--ok:#58D39B;--okb:#12362B;--bad:#FF8E7C;--badb:#3B1B1B;--line:#2A3A60;--soft:#1B2C52}}
:root[data-theme="dark"]{--bg:#0B1530;--card:#14213F;--ink:#EAF0FF;--mut:#A9B6D6;--blue:#7FB0FF;--ok:#58D39B;--okb:#12362B;--bad:#FF8E7C;--badb:#3B1B1B;--line:#2A3A60;--soft:#1B2C52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:16px}.w.d{max-width:1000px}
.hero{background:#13294B;color:#fff;border-radius:22px;padding:28px 22px;text-align:center}
.hero h1{margin:6px 0;font-size:32px;line-height:1.2;letter-spacing:-.01em}.hero p{margin:6px 0;color:#DCE6F7;font-size:15px;}
.flag{height:8px;border-radius:4px;background:linear-gradient(#C00000 50%,#fff 50%);margin:14px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.b{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--btn);color:#fff;font:700 17px inherit;font-family:inherit;padding:14px;cursor:pointer;margin:10px 0}
.b.s{background:var(--soft);color:var(--ink)}.b.y{background:var(--acc);color:#14213D}
.b:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{background:rgba(255,255,255,.14);border-radius:30px;padding:6px 12px;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:16px inherit;font-family:inherit;background:var(--card);color:var(--ink)}
.err{color:var(--bad);font-weight:600;min-height:20px}
.bar{height:10px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.tag{display:inline-block;background:var(--soft);border-radius:30px;padding:4px 12px;font-weight:700;font-size:14px;color:var(--ink)}
.q{font-size:19px;font-weight:600;margin:12px 0;white-space:pre-wrap;}
.o{display:block;width:100%;text-align:left;min-height:54px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:16px inherit;font-family:inherit;padding:12px 14px;margin:8px 0;cursor:pointer;white-space:pre-wrap;}
.o.ok{border-color:var(--ok);background:var(--okb);animation:pop .35s}.o.no{border-color:var(--bad);background:var(--badb)}
.o:hover{border-color:var(--blue)}
.o.selected{border-color:var(--blue);background:var(--soft);font-weight:600;}
.fb{border-radius:14px;padding:14px;margin:12px 0}.fb.ok{background:var(--okb)}.fb.no{background:var(--badb)}
@keyframes pop{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
table.t{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}table.t th,table.t td{border:1px solid var(--line);padding:8px;text-align:left}table.t th{background:var(--soft)}
.sc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sc div{background:var(--soft);border-radius:14px;padding:12px 4px}.sc b{display:block;font-size:26px}
.sw{overflow-x:auto}.sw table{min-width:100%}
.ov{position:fixed;inset:0;background:rgba(10,20,45,.93);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
.q-card{border: 2px solid var(--line); border-radius: 12px; padding:12px; margin-bottom: 12px; background:var(--bg);}
.q-card h4{margin: 0 0 10px 0;}

/* Tambahan untuk kategori skor, feedback, dan timer */
.score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.score-box { background: #EAF0FF; padding: 16px 8px; border-radius: 12px; text-align: center; }
.score-box span { display: block; font-size: 13px; color: var(--mut); margin-bottom: 4px; }
.score-box b { font-size: 24px; color: var(--ink); }
.feedback-box { padding: 16px; border-radius: 12px; margin: 16px 0; font-size: 15px; }
.feedback-box.ok { background: #E8F5E9; border: 1px solid #4CAF50; color: #1B5E20; }
.feedback-box.no { background: #FFEBEE; border: 1px solid #F44336; color: #B71C1C; }
.timer-box { font-weight: bold; color: var(--bad); font-size: 18px; text-align: center; padding: 8px; background: var(--badb); border-radius: 8px; margin-bottom: 12px; }
@media (max-width: 500px) { .score-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

/* Gaya Desain Mewah Hasil & Sertifikat */
.lux-card { background: linear-gradient(135deg, var(--card), var(--soft)); border: 1px solid var(--line); border-radius: 20px; padding: 40px 20px; box-shadow: 0 10px 30px rgba(31, 78, 156, 0.08); text-align: center; margin-bottom: 20px; }
.score-circle { width: 140px; height: 140px; background: linear-gradient(135deg, var(--btn), var(--blue)); border-radius: 50%; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 25px auto; box-shadow: 0 10px 25px rgba(31, 95, 184, 0.4); border: 6px solid var(--card); }
.score-circle b { font-size: 52px; line-height: 1.1; }
.cert-wrapper { overflow-x: auto; padding: 20px 0; background: #e9eff5; border-radius: 14px; margin-top: 10px; display: flex; justify-content: center; box-shadow: inset 0 4px 10px rgba(0,0,0,0.05); }

/* Pengaturan Sertifikat A4 Landscape - Desain Minimalis Sesuai Gambar */
.cert { 
    width: 1123px; min-width: 1123px; height: 794px; 
    background: #14213D; /* Warna bingkai luar (Biru Dongker) */
    position: relative; 
    padding: 18px; /* Ketebalan bingkai luar */
    box-sizing: border-box; 
    color: #14213D; 
    font-family: 'Segoe UI', system-ui, sans-serif; 
}
.cert-border-inner { 
    background: #fff; 
    width: 100%; height: 100%; 
    position: relative; 
    display: flex; flex-direction: column;
}
.cert-top-stripe { 
    width: 95%; 
    margin: 30px auto 10px; 
}
.cert-content { 
    flex: 1; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    text-align: center; padding: 0 50px; 
}
.cert-logos { display: flex; gap: 30px; justify-content: center; margin-bottom: 25px; }
.cert-logos img { height: 110px; object-fit: contain; } /* Ukuran logo disesuaikan */

.cert-score-grid { display: flex; justify-content: center; gap: 30px; margin: 30px 0; width: 100%; }
.cert-score-box-inner { background: #EAF0FF; border-radius: 12px; padding: 18px 20px; min-width: 170px; }
.cert-score-box-inner span { display: block; font-size: 16px; color: #55627F; margin-bottom: 8px; }
.cert-score-box-inner b { display: block; font-size: 42px; color: #14213D; }

@media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .c { border: none; padding: 0; margin: 0; box-shadow: none; }
    table.t th { background: #f0f0f0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===== KONFIGURASI ===== */
// URL Web App Google Apps Script Anda (WAJIB DIPASTIKAN BENAR)
var SHEET_URL = 'https://script.google.com/macros/s/AKfycbzPuXCLgDflKpk4SAWmyzIZIRQUVm08MTnIWpxScXJijKuvSb5AyW_7GR0-BDFGemfapA/exec';

/* ===== DATA SOAL DEFAULT ===== */
const defaultQuestions = [
    { q: "Siapakah proklamator kemerdekaan Republik Indonesia?", options: ["Ir. Soekarno & Drs. Moh. Hatta", "Soeharto & B.J. Habibie", "Jenderal Sudirman & Bung Tomo", "Sutan Sjahrir & Tan Malaka"], ans: 0, kategori: "Literasi", pembahasan: "Ir. Soekarno dan Drs. Moh. Hatta membacakan teks proklamasi pada 17 Agustus 1945." },
    { q: "Andi membeli barang seharga Rp120.000. Syarat diskon minimal pembelian Rp100.000. Apakah Andi memenuhi syarat?", options: ["Tidak, karena harus membeli Rp200.000", "Tidak, karena harga terlalu mahal", "Ya, karena diskonnya 20%", "Ya, karena Rp120.000 lebih dari Rp100.000"], ans: 3, kategori: "Numerasi", pembahasan: "Syarat minimal adalah Rp100.000, dan Rp120.000 sudah melebihi batas tersebut." },
    { q: "Semua mamalia bernapas dengan paru-paru. Paus adalah mamalia. Kesimpulannya?", options: ["Paus bernapas dengan insang", "Paus bukan mamalia", "Paus bernapas dengan paru-paru", "Paus hidup di air"], ans: 2, kategori: "Penalaran", pembahasan: "Karena paus masuk dalam kategori mamalia, maka sesuai premis ia bernapas dengan paru-paru." },
    { q: "Lagu kebangsaan Indonesia Raya diciptakan oleh?", options: ["Ibu Sud", "W.R. Supratman", "Ismail Marzuki", "C. Simanjuntak"], ans: 1, kategori: "Literasi", pembahasan: "W.R. Supratman pertama kali memperdengarkan lagu ini pada Kongres Pemuda II tahun 1928." }
];

/* ===== STATE APLIKASI ===== */
let state = {
    view: 'home', 
    user: null,
    currentQuestion: 0,
    score: 0,
    scores: { Literasi: 0, Numerasi: 0, Penalaran: 0 },
    answers: [],
    adminData: [],
    questions: [],
    waktuUjian: 10, // Default Waktu Ujian: 10 Menit sesuai permintaan
    timeRemaining: 0,
    timerInterval: null,
    tabViolations: 0,
    adminTab: 'hasil',
    selectedOption: null,
    answerSubmitted: false
};

// --- FUNGSI RENDER UTAMA ---
function render() {
    const app = document.getElementById('app');
    if (state.view === 'home') app.innerHTML = viewHome();
    else if (state.view === 'peserta_login') app.innerHTML = viewPesertaLogin();
    else if (state.view === 'panitia_login') app.innerHTML = viewPanitiaLogin();
    else if (state.view === 'quiz') app.innerHTML = viewQuiz();
    else if (state.view === 'result') app.innerHTML = viewResult();
    else if (state.view === 'panitia_dash') app.innerHTML = viewPanitiaDash();
}

function viewHome() {
    return `
        <div class="w">
            <div class="hero">
                <h1>MISI PEMUDA CERDAS</h1>
                <p>Lomba Literasi dan Numerasi (LITNUM) dalam rangka Hari Sumpah Pemuda</p>
                <div class="flag"></div>
            </div>
            <div class="c" style="text-align:center;">
                <h3 style="margin-top:0">Pilih Akses Masuk</h3>
                <button class="b y" onclick="navigate('peserta_login')">Masuk Sebagai Peserta</button>
                <button class="b s" onclick="navigate('panitia_login')">Masuk Sebagai Panitia</button>
            </div>
        </div>
    `;
}

function viewPesertaLogin() {
    return `
        <div class="w">
            <div class="c">
                <h2 style="margin-top:0">Login Peserta</h2>
                <label>Nama Lengkap</label>
                <input type="text" id="p_nama" placeholder="Masukkan nama Anda">
                <label>Kelas</label>
                <input type="text" id="p_kelas" placeholder="Masukkan kelas Anda (contoh: X AKL 1)">
                <button class="b" style="margin-top:20px" onclick="startQuiz()">Mulai Mengerjakan</button>
                <button class="b s" onclick="navigate('home')">Kembali</button>
            </div>
        </div>
    `;
}

function viewPanitiaLogin() {
    return `
        <div class="w">
            <div class="c">
                <h2 style="margin-top:0">Login Panitia</h2>
                <label>Password Panitia</label>
                <input type="password" id="a_pass" placeholder="Masukkan password">
                <button class="b" style="margin-top:20px" onclick="loginAdmin()">Masuk Dashboard</button>
                <button class="b s" onclick="navigate('home')">Kembali</button>
            </div>
        </div>
    `;
}

function viewQuiz() {
    if(state.questions.length === 0) return `<div class="w"><div class="c">Memuat soal...</div></div>`;
    const q = state.questions[state.currentQuestion];
    let optionsHtml = '';
    
    q.options.forEach((opt, idx) => {
        let isSelected = (state.selectedOption === idx) ? 'selected' : '';
        let extraClass = '';
        
        if (state.answerSubmitted) {
            if (idx === q.ans) extraClass = 'ok';
            else if (idx === state.selectedOption) extraClass = 'no';
        }
        
        optionsHtml += `<button class="o ${isSelected} ${extraClass}" onclick="selectOption(${idx})" ${state.answerSubmitted ? 'disabled' : ''}>${opt}</button>`;
    });

    let feedbackHtml = '';
    if (state.answerSubmitted) {
        const isCorrect = (state.selectedOption === q.ans);
        const feedbackText = isCorrect ? '<b>BENAR!</b> Hebat! Kamu berhasil menjawab dengan tepat.' : '<b>Belum tepat.</b> Coba perhatikan kembali informasi dalam soal. Salah itu bagian dari belajar.';
        const feedbackClass = isCorrect ? 'ok' : 'no';
        feedbackHtml = `
            <div class="feedback-box ${feedbackClass}">
                ${feedbackText}<br><br>
                <b>Pembahasan:</b> ${q.pembahasan || 'Tidak ada pembahasan.'}
            </div>
            <button class="b" onclick="nextQuestion()">LANJUT</button>
        `;
    }

    const minutes = Math.floor(state.timeRemaining / 60);
    const seconds = state.timeRemaining % 60;
    const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

    return `
        <div class="w">
            <div class="c">
                <div class="timer-box">⏳ Waktu Tersisa: <span id="timerText">${timeString}</span></div>
                <div class="top">
                    <span>Soal ${state.currentQuestion + 1} / ${state.questions.length}</span>
                    <span class="tag">${state.user.nama}</span>
                </div>
                <div class="bar" style="margin: 10px 0;"><i style="width: ${((state.currentQuestion) / state.questions.length) * 100}%"></i></div>
                <div class="q">${q.q}</div>
                ${optionsHtml}
                ${!state.answerSubmitted ? `<button class="b" style="margin-top:20px" onclick="submitAnswer()" ${state.selectedOption === null ? 'disabled' : ''}>Jawab</button>` : feedbackHtml}
            </div>
        </div>
    `;
}

function viewResult() {
    const certNo = `MPC-${Math.random().toString(36).substr(2, 8).toUpperCase()}`;
    const today = new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});

    return `
        <div class="w d">
            <div class="lux-card">
                <h2 style="color:var(--btn); margin-top:0; font-size:32px; font-weight:800;">Ujian Selesai!</h2>
                <p style="font-size:17px;">Terima kasih, <b>${state.user.nama}</b> telah menyelesaikan ujian dengan baik.</p>
                
                <div class="score-grid">
                    <div class="score-box"><span>Literasi</span><b>${Math.round(state.scores.Literasi || 0)}</b></div>
                    <div class="score-box"><span>Numerasi</span><b>${Math.round(state.scores.Numerasi || 0)}</b></div>
                    <div class="score-box"><span>Penalaran</span><b>${Math.round(state.scores.Penalaran || 0)}</b></div>
                    <div class="score-box"><span>Skor Akhir</span><b>${Math.round(state.score)}</b></div>
                </div>

                <p style="color:var(--mut); font-size:15px; margin-bottom:28px;">Hasil Anda telah dikirim dan direkam secara otomatis oleh sistem Panitia.</p>
                
                <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
                    <button class="b y" style="max-width:250px; margin:0; display:flex; align-items:center; justify-content:center; gap:8px; font-size:16px;" onclick="downloadCertificate()">
                        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        Unduh Sertifikat
                    </button>
                    <button class="b s" style="max-width:250px; margin:0; font-size:16px;" onclick="navigate('home')">Kembali ke Beranda</button>
                </div>
            </div>

            <div class="c" style="overflow:hidden; text-align:center;">
                <h3 style="margin-top:0; color:var(--ink);">Preview Sertifikat</h3>
                <div class="cert-wrapper">
                    <!-- Desain Sertifikat Sesuai Referensi Gambar -->
                    <div class="cert" id="certificateNode">
                        <div class="cert-border-inner">
                            <div class="cert-top-stripe">
                                <div style="background:#208c43; height:18px; width:100%;"></div>
                                <div style="background:#f2b705; height:6px; width:100%;"></div>
                                <div style="background:#1f5fb8; height:18px; width:100%;"></div>
                            </div>
                            
                            <div class="cert-content">
                                <div class="cert-logos">
                                    <img src="./LOGO%20SMK%2045.png" alt="Logo SMK" crossorigin="anonymous">
                                    <img src="./Logo%20Festival%20Literasi%20LITNUM%20FEST.png" alt="Logo Litnum" crossorigin="anonymous">
                                </div>
                                
                                <h4 style="font-size: 22px; font-weight: 700; color: #14213D; margin: 15px 0;">SMK 02 ISLAM 45 AMBULU</h4>
                                <h1 style="font-size: 58px; font-weight: 800; color: #14213D; margin: 0 0 5px 0; letter-spacing: 2px;">SERTIFIKAT</h1>
                                <h3 style="font-size: 22px; font-weight: 600; color: #1f5fb8; margin: 0;">MISI PEMUDA CERDAS</h3>
                                
                                <p style="font-size: 18px; margin: 35px 0 10px; color: #333;">diberikan kepada</p>
                                <h2 style="font-size: 54px; margin: 0 0 8px 0; color: #14213D;">${state.user.nama}</h2>
                                <div style="width: 80%; height: 4px; background: #14213D; margin: 0 auto;"></div>
                                <p style="font-size: 20px; font-weight: 700; margin: 15px 0 35px; color: #14213D;">Kelas ${state.user.instansi}</p>
                                
                                <p style="font-size: 18px; margin: 0; color: #333;">telah menyelesaikan Misi Pemuda Cerdas, game literasi numerasi<br>SMK 02 Islam 45 Ambulu, dengan hasil:</p>
                                
                                <div class="cert-score-grid">
                                    <div class="cert-score-box-inner"><span>Literasi</span><b>${Math.round(state.scores.Literasi || 0)}</b></div>
                                    <div class="cert-score-box-inner"><span>Numerasi</span><b>${Math.round(state.scores.Numerasi || 0)}</b></div>
                                    <div class="cert-score-box-inner"><span>Penalaran</span><b>${Math.round(state.scores.Penalaran || 0)}</b></div>
                                    <div class="cert-score-box-inner"><span>Skor Akhir</span><b>${Math.round(state.score)}</b></div>
                                </div>
                                
                                <h3 style="font-size: 26px; font-weight: 700; color: #14213D; margin: 0 0 10px 0;">MASTER PEMUDA CERDAS</h3>
                                <p style="font-size: 16px; color: #55627F; margin: 0;">Terus latih literasi dan numerasimu karena digunakan setiap hari.</p>
                                
                                <!-- Bagian tanda tangan dihilangkan sesuai permintaan -->
                                <p style="font-size: 14px; color: #777; margin: 40px 0 0 0;">Diterbitkan oleh Kesiswaan SMK 02 Islam 45 Ambulu<br>${today} | No. ${certNo}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function downloadCertificate() {
    const cert = document.getElementById('certificateNode');
    if(!cert) return;
    showModal('Sedang menyiapkan sertifikat, mohon tunggu sebentar...');
    
    html2canvas(cert, { 
        scale: 2,
        useCORS: true, 
        allowTaint: true,
        backgroundColor: "#14213D"
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Sertifikat_LITNUM_${state.user.nama}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        document.body.removeChild(document.body.lastChild);
    }).catch(err => {
        console.error(err);
        document.body.removeChild(document.body.lastChild);
        showModal('Gagal mengunduh sertifikat. Pastikan browser Anda mendukung fitur ini.');
    });
}

function viewPanitiaDash() {
    let content = '';
    if(state.adminTab === 'hasil') {
        content = renderAdminHasil();
    } else {
        content = renderAdminSoal();
    }

    return `
        <div class="w d">
            <div class="c">
                <div class="top no-print">
                    <h2>Dashboard Panitia</h2>
                    <div>
                        <button class="b s" style="display:inline-block; width:auto; min-height:auto; padding:8px 16px; margin:0; ${state.adminTab==='hasil'?'background:var(--blue);color:#fff;':''}" onclick="state.adminTab='hasil'; render()">Hasil Ujian</button>
                        <button class="b s" style="display:inline-block; width:auto; min-height:auto; padding:8px 16px; margin:0; ${state.adminTab==='soal'?'background:var(--blue);color:#fff;':''}" onclick="state.adminTab='soal'; render()">Kelola Soal</button>
                        <button class="b" style="display:inline-block; width:auto; min-height:auto; padding:8px 16px; margin:0; background:var(--bad);" onclick="navigate('home')">Keluar</button>
                    </div>
                </div>
                <div style="margin-top:20px;">
                    ${content}
                </div>
            </div>
        </div>
    `;
}

function renderAdminHasil() {
    let rows = '';
    if(state.adminData.length === 0) {
        rows = `<tr><td colspan="4" style="text-align:center">Belum ada data atau sedang memuat...</td></tr>`;
    } else {
        state.adminData.forEach((d, i) => {
            rows += `<tr>
                <td>${i+1}</td>
                <td>${d.nama}</td>
                <td>${d.instansi}</td>
                <td><b>${d.skor}</b></td>
            </tr>`;
        });
    }
    return `
        <div class="no-print" style="margin-bottom:12px;">
            <button class="b s" style="display:inline-block; width:auto; padding:8px 16px; margin:0" onclick="fetchDataAdmin()">Refresh Data</button>
            <button class="b y" style="display:inline-block; width:auto; padding:8px 16px; margin:0" onclick="window.print()">Cetak (Print)</button>
        </div>
        <div class="sw">
            <table class="t">
                <thead><tr><th width="50">No</th><th>Nama Peserta</th><th>Kelas</th><th width="100">Skor</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    `;
}

function renderAdminSoal() {
    let list = '';
    state.questions.forEach((q, i) => {
        list += `
        <div class="q-card" style="font-size:14px;">
            <b>${i+1}. [${q.kategori || 'Umum'}] ${q.q}</b><br>
            <span style="color:${q.ans===0?'var(--ok)':'inherit'}">A. ${q.options[0]}</span> | 
            <span style="color:${q.ans===1?'var(--ok)':'inherit'}">B. ${q.options[1]}</span> | 
            <span style="color:${q.ans===2?'var(--ok)':'inherit'}">C. ${q.options[2]}</span> | 
            <span style="color:${q.ans===3?'var(--ok)':'inherit'}">D. ${q.options[3]}</span><br>
            <i style="color:var(--mut); font-size:12px;">Pembahasan: ${q.pembahasan || '-'}</i>
        </div>`;
    });

    return `
        <div class="no-print">
            <div style="background:var(--soft); padding:16px; border-radius:12px; margin-bottom:16px;">
                <h3 style="margin-top:0; margin-bottom:8px;">Pengaturan Ujian</h3>
                <label>Batas Waktu Pengerjaan (Menit)</label>
                <!-- Nilai default 10 menit sudah disiapkan di sini -->
                <input type="number" id="waktuUjianInput" value="${state.waktuUjian}" style="margin-bottom:8px; width:100px; font-weight:bold;">
                <p style="font-size:13px; color:var(--mut); margin-top:0; margin-bottom:16px;">
                    Ubah angka di atas untuk mengatur ulang durasi ujian siswa (misal: 10 untuk 10 menit).
                </p>

                <h3 style="margin-top:0; margin-bottom:8px;">Upload Soal via Excel</h3>
                <p style="font-size:14px; margin-top:0;">Buat file Excel dengan 8 kolom berurutan:<br>
                <b>Pertanyaan | Opsi A | Opsi B | Opsi C | Opsi D | Jawaban | Kategori | Pembahasan</b><br>
                <i>(Kategori isi dengan: Literasi, Numerasi, atau Penalaran)</i></p>
                
                <input type="file" id="fileUpload" accept=".xlsx, .xls, .csv" style="margin-top:8px; padding:10px; background:#fff; width:100%; border-radius:8px;" onchange="handleFileUpload(event)">
            </div>
            
            <h3 style="margin-top:0">Preview Soal (${state.questions.length})</h3>
            ${list}
            <button class="b y" style="margin-top:16px;" onclick="saveQuestionsToSheet()">Simpan Pengaturan & Soal ke Server</button>
        </div>
    `;
}

// --- LOGIKA APLIKASI ---

function navigate(viewName) {
    state.view = viewName;
    render();
}

function showModal(msg) {
    const m = document.createElement('div');
    m.className = 'ov';
    m.innerHTML = `<div class="c" style="width:100%; max-width:320px; text-align:center; animation:pop 0.3s">
        <h3 style="margin-top:0">Info</h3>
        <p>${msg}</p>
        <button class="b" onclick="this.parentElement.parentElement.remove()">Tutup</button>
    </div>`;
    document.body.appendChild(m);
}

// Peserta
function startQuiz() {
    const nama = document.getElementById('p_nama').value.trim();
    const kelas = document.getElementById('p_kelas').value.trim();
    
    if(!nama || !kelas) { showModal('Nama dan Kelas wajib diisi!'); return; }
    
    state.user = { nama, instansi: kelas }; 
    state.currentQuestion = 0;
    state.score = 0;
    state.scores = { Literasi: 0, Numerasi: 0, Penalaran: 0 };
    state.answers = [];
    state.selectedOption = null;
    state.answerSubmitted = false;
    state.tabViolations = 0;
    
    state.timeRemaining = state.waktuUjian * 60;
    if (state.timerInterval) clearInterval(state.timerInterval);
    
    document.addEventListener('visibilitychange', handleVisibilityChange);
    
    if(state.questions.length === 0) loadQuestions(true);
    else initQuizTimer();
}

function initQuizTimer() {
    navigate('quiz');
    state.timerInterval = setInterval(() => {
        state.timeRemaining--;
        if(state.timeRemaining <= 0) {
            clearInterval(state.timerInterval);
            finishQuiz(true, "Waktu habis! Jawaban Anda telah dikumpulkan otomatis.");
        } else {
            const timerEl = document.getElementById('timerText');
            if(timerEl) {
                const m = Math.floor(state.timeRemaining / 60);
                const s = state.timeRemaining % 60;
                timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
        }
    }, 1000);
}

function handleVisibilityChange() {
    if (document.hidden && state.view === 'quiz') {
        state.tabViolations++;
        if (state.tabViolations >= 3) {
            finishQuiz(true, "Anda telah keluar dari halaman ujian sebanyak 3 kali. Ujian dihentikan otomatis.");
        } else {
            showModal(`Peringatan (${state.tabViolations}/3): Jangan keluar dari halaman ujian atau berpindah tab/aplikasi! Jika mencapai 3 kali, ujian akan dihentikan.`);
        }
    }
}

function selectOption(idx) {
    if (state.answerSubmitted) return;
    state.selectedOption = idx;
    render();
}

function submitAnswer() {
    if(state.selectedOption === null) return; 
    
    const q = state.questions[state.currentQuestion];
    const isCorrect = (state.selectedOption === q.ans);
    
    const totalSoalKategori = state.questions.filter(x => x.kategori === q.kategori).length || 1;
    const poinKategori = 100 / totalSoalKategori; 
    const poinTotal = 100 / state.questions.length;
    
    if(isCorrect) {
        state.score += poinTotal;
        if(q.kategori && state.scores[q.kategori] !== undefined) {
            state.scores[q.kategori] += poinKategori;
        } else if (q.kategori) {
            state.scores[q.kategori] = poinKategori;
        }
    }
    
    state.answers.push(state.selectedOption);
    state.answerSubmitted = true;
    render();
}

function nextQuestion() {
    state.selectedOption = null; 
    state.answerSubmitted = false;
    state.currentQuestion++;
    
    if(state.currentQuestion >= state.questions.length) {
        finishQuiz();
    } else {
        render();
    }
}

function finishQuiz(forced = false, msg = "") {
    clearInterval(state.timerInterval);
    document.removeEventListener('visibilitychange', handleVisibilityChange);
    saveDataToSheet(state.user.nama, state.user.instansi, Math.round(state.score));
    navigate('result');
    if(forced) {
        setTimeout(() => showModal(msg), 500);
    }
}

// Panitia
function loginAdmin() {
    const pass = document.getElementById('a_pass').value;
    if(pass === 'panitia123') { 
        state.adminTab = 'hasil';
        navigate('panitia_dash');
        fetchDataAdmin(); 
    } else {
        showModal('Password panitia salah!');
    }
}

function handleFileUpload(event) {
    const file = event.target.files[0];
    if(!file) return;

    showModal('Sedang memproses file Excel...');

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(firstSheet, {defval: ""});

            let newQuestions = [];
            json.forEach(row => {
                const keys = Object.keys(row);
                if(keys.length >= 6) {
                    const q = row[keys[0]];
                    const a = row[keys[1]];
                    const b = row[keys[2]];
                    const c = row[keys[3]];
                    const d = row[keys[4]];
                    const ansStr = String(row[keys[5]]).toUpperCase().trim();
                    const kategori = keys.length >= 7 ? row[keys[6]] : "Umum";
                    const pembahasan = keys.length >= 8 ? row[keys[7]] : "";

                    let ansIdx = 0; 
                    if(ansStr === 'B') ansIdx = 1;
                    else if(ansStr === 'C') ansIdx = 2;
                    else if(ansStr === 'D') ansIdx = 3;

                    if(q && a) { 
                        newQuestions.push({
                            q: String(q),
                            options: [String(a), String(b), String(c), String(d)],
                            ans: ansIdx,
                            kategori: String(kategori),
                            pembahasan: String(pembahasan)
                        });
                    }
                }
            });

            document.body.removeChild(document.body.lastChild);

            if(newQuestions.length > 0) {
                state.questions = newQuestions;
                render();
                showModal('Berhasil memuat ' + newQuestions.length + ' soal. Cek preview di bawah, lalu klik "Simpan Pengaturan & Soal ke Server"!');
            } else {
                showModal('Gagal membaca data. Pastikan ada minimal 6 kolom yang terisi sesuai format.');
            }
        } catch (err) {
            console.error(err);
            document.body.removeChild(document.body.lastChild);
            showModal('Terjadi kesalahan. Pastikan file berupa format Excel yang valid (.xlsx / .csv).');
        }
    };
    reader.readAsArrayBuffer(file);
}

function loadQuestions(autoStartQuiz = false) {
    if(!SHEET_URL) {
        state.questions = JSON.parse(JSON.stringify(defaultQuestions));
        if(autoStartQuiz) initQuizTimer();
        return;
    }
    fetch(SHEET_URL + "?action=getQuestions")
        .then(res => res.json())
        .then(data => {
            if (Array.isArray(data) && data.length > 0) {
                state.questions = data;
            } else if (data && data.questions && data.questions.length > 0) {
                state.questions = data.questions;
                // Tetapkan 10 sebagai default/fallback jika tidak terbaca dari server
                state.waktuUjian = data.waktu || 10; 
            } else {
                state.questions = JSON.parse(JSON.stringify(defaultQuestions));
            }
            if(autoStartQuiz) initQuizTimer();
        })
        .catch(e => {
            console.log('Gagal ambil soal online, pakai default.', e);
            state.questions = JSON.parse(JSON.stringify(defaultQuestions));
            if(autoStartQuiz) initQuizTimer();
        });
}

function saveQuestionsToSheet() {
    const waktuInput = document.getElementById('waktuUjianInput');
    // Ambil angka dari inputan panitia, jika kosong pakai 10 menit
    if (waktuInput) state.waktuUjian = parseInt(waktuInput.value) || 10;
    
    const payload = JSON.stringify({
        waktu: state.waktuUjian,
        questions: state.questions
    });
    
    showModal('Sedang menyimpan pengaturan & soal...');
    fetch(SHEET_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `action=saveQuestions&questions=${encodeURIComponent(payload)}`
    })
    .then(() => {
        showModal('Berhasil menyimpan pengaturan (waktu: ' + state.waktuUjian + ' menit) dan soal! Peserta yang login setelah ini akan memakai aturan baru.');
    })
    .catch(e => showModal('Gagal menyimpan. Pastikan URL Script benar.'));
}

function saveDataToSheet(nama, instansi, skor) {
    if(!SHEET_URL) return;
    fetch(SHEET_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `action=save&nama=${encodeURIComponent(nama)}&instansi=${encodeURIComponent(instansi)}&skor=${skor}`
    }).catch(e => console.log('Gagal menyimpan hasil', e));
}

function fetchDataAdmin() {
    if(!SHEET_URL) return;
    fetch(SHEET_URL + "?action=get")
        .then(res => res.json())
        .then(data => {
            state.adminData = (data && Array.isArray(data)) ? data : [];
            render();
        })
        .catch(e => {
            console.log('Gagal mengambil data peserta', e);
        });
}

// Jalankan saat pertama kali dibuka
loadQuestions();
render();
</script>
